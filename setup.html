<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接百炼 · AI SuperMall</title><style>body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;display:grid;min-height:100vh;place-items:center}.box{width:min(520px,calc(100% - 40px));background:#fff;border-radius:24px;padding:42px;box-shadow:0 20px 60px #00000012}h1{font-size:32px;margin:0 0 12px}p{color:#6e6e73;line-height:1.7}textarea{width:100%;height:104px;margin:20px 0 12px;padding:14px;border:1px solid #d2d2d7;border-radius:12px;font:15px ui-monospace,monospace;box-sizing:border-box}button{border:0;border-radius:12px;background:#0071e3;color:white;padding:14px 20px;font-size:16px;font-weight:600;cursor:pointer}.note{font-size:13px}.status{min-height:24px;color:#0071e3;margin-top:14px}</style><main class="box"><h1>连接百炼</h1><p>只需一次：把你从阿里云百炼复制的 API Key 粘贴到下面，再点击保存。</p><textarea id="key" placeholder="在这里粘贴 API Key"></textarea><button id="save">保存并连接</button><p class="note">密钥只保存在这台电脑，不会显示在网站页面，也不要发送给任何人。</p><div class="status" id="status"></div></main><script>document.querySelector('#save').onclick=async()=>{let k=document.querySelector('#key').value.trim(),s=document.querySelector('#status');if(!k)return s.textContent='请先粘贴 API Key。';s.textContent='正在保存…';let r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:k})}),d=await r.json();if(r.ok){s.textContent='已连接。现在进入营销工作台。';setTimeout(()=>location.href='/marketing-studio.html',700)}else s.textContent=d.error||'保存失败，请重试。'};</script></html>
