<body class="account-body"><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>AI SuperMall</span></a><div class="nav-actions"><button class="language-toggle" id="languageToggle">EN</button><a class="account-link" href="index.html" id="homeLink">返回首页</a></div></header>
<main class="account-page"><section class="account-panel"><p class="kicker">AI SUPERMALL MEMBER</p><h1 id="pageTitle">保存你的项目，随时继续。</h1><p class="account-intro" id="pageIntro">使用邮箱注册。请点击邮件中的确认链接；以后可用邮箱和密码登录。</p><p class="account-status" id="accountStatus" aria-live="polite"></p>

<form class="account-form" id="loginForm" hidden><label for="loginEmail" id="loginEmailLabel">邮箱</label><input id="loginEmail" type="email" autocomplete="email" required><label for="loginPassword" id="loginPasswordLabel">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required><button type="submit" id="loginSubmit">登录</button></form>
<section id="memberArea" hidden><nav class="member-nav"><a id="memberProjectsLink" href="?view=projects">我的项目</a><a id="memberChatsLink" href="?view=chats">对话历史</a><a id="memberAccountLink" href="?view=account">账户</a></nav><section id="projectsView"><div class="member-heading"><div><h2 id="welcomeTitle">你的项目</h2><p id="projectsIntro">打开项目后可继续对话。</p></div></div><form class="new-project" id="projectForm"><input id="projectTitle" maxlength="120" required><button type="submit" id="projectSubmit">新建项目</button></form><div class="project-list" id="projectList"></div></section><section id="chatsView" hidden><div class="member-heading"><div><h2 id="chatsTitle">对话历史</h2><p id="chatsIntro">普通聊天会自动保存，可随时重新打开。</p></div></div><div class="project-list" id="chatList"></div></section><section id="accountView" hidden><div class="member-heading"><div><h2 id="accountTitle">账户</h2><p id="memberEmail"></p></div><button class="quiet-button" id="logoutButton" type="button">退出登录</button></div><p id="accountSummary">会员账户已登录。你可以在这里管理语言和账户设置。</p></section></section>
