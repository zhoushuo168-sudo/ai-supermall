<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI SuperMall — 会员</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="project.css"></head>
<body class="account-body"><header class="nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>AI SuperMall</span></a><div class="nav-actions"><button class="language-toggle" id="languageToggle">EN</button><a class="account-link" href="index.html" id="homeLink">返回首页</a></div></header>
<main class="account-page"><section class="account-panel"><p class="kicker">AI SUPERMALL MEMBER</p><h1 id="pageTitle">保存你的项目，随时继续。</h1><p class="account-intro" id="pageIntro">使用邮箱注册。请点击邮件中的确认链接；以后可用邮箱和密码登录。</p><p class="account-status" id="accountStatus" aria-live="polite"></p>
<div class="auth-tabs" id="authTabs"><button type="button" class="active" data-tab="register" id="registerTab">注册</button><button type="button" data-tab="login" id="loginTab">登录</button></div>
<form class="account-form" id="registerForm"><label for="registerEmail" id="registerEmailLabel">邮箱</label><input id="registerEmail" type="email" autocomplete="email" required><label for="registerPassword" id="registerPasswordLabel">密码（至少 8 位）</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required><button type="submit" id="registerSubmit">发送确认邮件</button></form>
<form class="account-form" id="loginForm" hidden><label for="loginEmail" id="loginEmailLabel">邮箱</label><input id="loginEmail" type="email" autocomplete="email" required><label for="loginPassword" id="loginPasswordLabel">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required><button type="submit" id="loginSubmit">登录</button></form>
<section id="memberArea" hidden><div class="member-heading"><div><h2 id="welcomeTitle">你的项目</h2><p id="memberEmail"></p></div><button class="quiet-button" id="logoutButton" type="button">退出登录</button></div><form class="new-project" id="projectForm"><input id="projectTitle" maxlength="120" required><button type="submit" id="projectSubmit">新建项目</button></form><div class="project-list" id="projectList"></div></section>
<p class="account-note" id="accountNote">你的登录信息不会显示在网站页面中。中国区账户服务暂未启用。</p></section></main><script src="account.js"></script></body></html>
