<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="golf.css?v=golf-13">
<link rel="stylesheet" href="ios-input-nozoom.css">

</head>
<body class="workspace-body zone-page golf-app">
<header class="nav">
<a class="brand" href="index.html"><span class="brand-mark">✦</span><span>AI SuperMall</span></a>
<nav class="zone-header-nav" aria-label="导航 / Navigation"><a data-zone-zh="首页" data-zone-en="Home" href="index.html#top">首页</a><a data-zone-zh="历史" data-zone-en="History" href="account.html?view=chats">历史</a><a data-zone-zh="项目" data-zone-en="Projects" href="account.html?view=projects">项目</a><a data-zone-zh="账户" data-zone-en="Account" href="account.html?view=account">账户</a></nav>
<div class="nav-actions"><a class="golf-nav-link" href="index.html#top" data-zone-zh="首页" data-zone-en="Home">首页</a><button class="golf-nav-link" id="golfSignOut" type="button" data-zone-zh="登出" data-zone-en="Sign out">登出</button><button class="language-toggle" id="languageToggle" type="button" aria-label="Switch language">EN</button></div>
</header>
<main class="workspace-main">
<section class="workspace-heading"><div><p class="kicker">SPORTS · GOLF</p><h1 data-zone-zh="高尔夫挥杆分析" data-zone-en="Golf Swing Analysis">高尔夫挥杆分析</h1><p data-zone-zh="上传你的挥杆视频，看看哪里可以提高。" data-zone-en="Upload your swing. See what you can improve.">上传你的挥杆视频，看看哪里可以提高。</p></div><a data-zone-zh="返回运动" data-zone-en="Back to Sports" class="workspace-back" href="sports.html">返回运动</a></section>
<section id="golfSetup" class="workspace-panel golf-card">
<label class="golf-upload" id="golfDrop" for="golfFile">
<strong data-zone-zh="上传挥杆视频" data-zone-en="Upload swing video">上传挥杆视频</strong>
<span data-zone-zh="从相册或文件中选择。支持 MP4、MOV、WEBM，最大 80 MB。" data-zone-en="Choose from your photos or files. MP4, MOV, or WEBM, up to 80 MB.">从相册或文件中选择。支持 MP4、MOV、WEBM，最大 80 MB。</span>
<input id="golfFile" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm">
</label>
<div id="golfPreviewWrap" class="golf-preview" hidden>
<video id="golfPreview" controls playsinline webkit-playsinline></video>
<button type="button" id="golfRemove" class="golf-text-button" data-zone-zh="删除视频" data-zone-en="Remove video">删除视频</button>
</div>
<fieldset class="golf-field">
<legend data-zone-zh="球杆" data-zone-en="Club">球杆</legend>
<div class="golf-choices">
<label class="golf-choice"><input type="radio" name="club" value="driver"><span data-zone-zh="铁杆" data-zone-en="Iron">铁杆</span></label>
<label class="golf-choice"><input type="radio" name="club" value="iron"><span data-zone-zh="1号木" data-zone-en="Driver">1号木</span></label>
</div>
</fieldset>
<fieldset class="golf-field">
<legend data-zone-zh="拍摄角度" data-zone-en="Camera angle">拍摄角度</legend>
<div class="golf-choices">
<label class="golf-choice"><input type="radio" name="angle" value="face-on"><span data-zone-zh="正面" data-zone-en="Face On">正面</span></label>
<label class="golf-choice"><input type="radio" name="angle" value="down-the-line"><span data-zone-zh="侧后方" data-zone-en="Down the Line">侧后方</span></label>
</div>
</fieldset>
<button type="button" id="golfAnalyze" class="golf-primary" data-zone-zh="分析挥杆" data-zone-en="Analyze Swing">分析挥杆</button>
<p id="golfStatus" class="golf-status" aria-live="polite"></p>
<section id="golfSaved" class="golf-saved" hidden>
<h2 data-zone-zh="已保存的挥杆" data-zone-en="Saved swings">已保存的挥杆</h2>
<div id="golfSavedList"></div>
</section>
</section>
<section id="golfResult" class="workspace-panel golf-card" hidden>
<h2 data-zone-zh="挥杆分析结果" data-zone-en="Swing Analysis Result">挥杆分析结果</h2>
<section id="golfSwingSpan" class="golf-swing-span">
<p id="golfSwingSpanText">诊断 span-7
正在查找完整挥杆…</p>
<video id="golfSwingClip" class="golf-player" controls playsinline webkit-playsinline hidden></video>
</section>
<div class="golf-compare">
<section class="golf-swing-block">
<h3 data-zone-zh="你的挥杆" data-zone-en="Your Swing">你的挥杆</h3>
<div class="golf-stage">
<video id="golfResultVideo" class="golf-player" playsinline webkit-playsinline></video>
<canvas id="golfAnalysisCanvas" class="golf-analysis-layer" hidden aria-hidden="true"></canvas>
<canvas id="golfPoseCanvas" hidden></canvas>
</div>
</section>
<div class="golf-transport" role="group" aria-label="Playback">
<button type="button" id="golfPlay" data-zone-zh="播放" data-zone-en="Play">播放</button>
<button type="button" id="golfPause" data-zone-zh="暂停" data-zone-en="Pause">暂停</button>
<button type="button" id="golfReplay" data-zone-zh="重放" data-zone-en="Replay">重放</button>
</div>
<div class="golf-speeds" role="group" aria-label="Playback speed">
<button type="button" class="golf-speed" data-golf-speed="1" aria-pressed="true">1×</button>
<button type="button" class="golf-speed" data-golf-speed="0.5" aria-pressed="false">0.5×</button>
<button type="button" class="golf-speed" data-golf-speed="0.3" aria-pressed="false">0.3×</button>
</div>
<section class="golf-swing-block">
<h3 data-zone-zh="标准挥杆" data-zone-en="Standard Swing">标准挥杆</h3>
<div class="golf-stage golf-standard-stage">
<video id="golfStandardVideo" class="golf-player" src="/golf/standard/driver-face-v1.mp4" playsinline webkit-playsinline preload="auto" muted hidden></video>
<canvas id="golfStandardPoseCanvas" class="golf-standard-pose" hidden aria-hidden="true"></canvas>
<p id="golfStandardPoseStatus" class="golf-standard-pose-status" hidden></p>
<p id="golfStandardEmpty" class="golf-standard-empty" hidden data-zone-zh="标准挥杆视频将放在这里。" data-zone-en="Standard swing video will be added here.">标准挥杆视频将放在这里。</p>
</div>
</section>
</div>
<section id="golfStills" class="golf-stills" hidden>
<div id="golfStillsGrid" class="golf-stills-grid"></div>
</section>
<section id="golfFindings" class="golf-findings">
<h3 data-zone-zh="与标准的差异" data-zone-en="Difference from the standard">与标准的差异</h3>
<p id="golfFindingsNote" data-zone-zh="分析后，这里显示与标准挥杆的差异。" data-zone-en="Differences from the standard swing appear here after analysis.">分析后，这里显示与标准挥杆的差异。</p>
<div id="golfFindingsList" hidden></div>
</section>
<dl class="golf-facts" hidden>
<div><dt data-zone-zh="挥杆视频" data-zone-en="Swing video">挥杆视频</dt><dd id="golfResultName"></dd></div>
<div><dt data-zone-zh="球杆" data-zone-en="Club">球杆</dt><dd id="golfResultClub"></dd></div>
<div><dt data-zone-zh="拍摄角度" data-zone-en="Camera angle">拍摄角度</dt><dd id="golfResultAngle"></dd></div>
</dl>
<p class="golf-pose-note" data-zone-zh="骨架和参考线只画在你的视频上。标准挥杆保持原样。" data-zone-en="The skeleton and guide lines are drawn only on your video. The standard swing stays clean.">骨架和参考线只画在你的视频上。标准挥杆保持原样。</p>
<p id="golfPoseStatus" class="golf-pose-status" aria-live="polite"></p>
<button type="button" id="golfAnother" class="golf-primary" data-zone-zh="分析另一支挥杆" data-zone-en="Analyze another swing">分析另一支挥杆</button>
</section>
</main>
