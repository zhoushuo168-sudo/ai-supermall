<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI SuperMall</title>
  <link rel="stylesheet" href="style.css?v=presentation-2">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="presentation-workflow.css?v=presentation-2">
  <link rel="stylesheet" href="mobile-navigation.css">
  <link rel="stylesheet" href="ios-input-nozoom.css">
</head>
<body class="workspace-body presentation-workspace" data-workspace="presentation">
  <header class="nav">
    <a class="brand" href="index.html"><span class="brand-mark">✦</span><span>AI SuperMall</span></a>
    <div class="nav-actions"><button class="language-toggle" id="languageToggle" type="button">EN</button><a class="account-link" id="projectsLink" href="account.html?view=projects">我的项目</a></div>
  </header>
  <main class="workspace-main">
    <section class="workspace-heading"><div><p class="kicker">AI SUPERMALL CREATE</p><h1 id="workspaceTitle"></h1><p id="workspaceDescription"></p></div><a class="workspace-back" id="homeLink" href="index.html">首页</a></section>
    <section class="workspace-grid presentation-grid">
      <section class="workspace-panel" id="presentationTaskPanel">
        <h2 id="presentationPanelTitle"></h2>
        <p id="presentationPanelCopy"></p>
        <form class="workspace-form" id="workspaceForm">
          <label id="projectNameLabel" for="projectName">项目名称</label>
          <input id="projectName" class="workspace-project-name" maxlength="120" autocomplete="off">
          <label id="taskInputLabel" for="taskInput">你的需求</label>
          <textarea id="taskInput" required></textarea>
          <div class="presentation-voice-row">
            <button type="button" id="presentationVoice" class="voice-button" aria-pressed="false">◉</button>
            <select id="presentationVoiceLanguage" aria-label="识别语言">
              <option value="browser">浏览器语言</option>
              <option value="zh-CN">中文</option>
              <option value="en-US">English</option>
              <option value="de-DE">Deutsch</option>
              <option value="fr-FR">Français</option>
              <option value="ja-JP">日本語</option>
              <option value="es-ES">Español</option>
              <option value="ko-KR">한국어</option>
              <option value="pt-BR">Português</option>
              <option value="it-IT">Italiano</option>
              <option value="ru-RU">Русский</option>
              <option value="ar-SA">العربية</option>
            </select>
            <p id="presentationVoiceStatus" class="voice-status presentation-voice-status" hidden></p>
          </div>
          <div class="workspace-actions presentation-actions">
            <button id="workspaceSubmit" type="submit"></button>
            <button class="secondary" id="presentationRegenerate" type="button"></button>
            <button class="secondary" id="presentationDownload" type="button"></button>
            <button class="secondary" id="saveProject" type="button"></button>
          </div>
          <p class="workspace-status" id="workspaceGenerationStatus" aria-live="polite"></p>
        </form>
      </section>
      <section class="workspace-results" id="workspaceResults" hidden>
        <p class="kicker">PRESENTATION</p>
        <h2 id="presentationDeckTitle"></h2>
        <p id="presentationResultCopy"></p>
        <div id="presentationSlides" class="presentation-stage"></div>
      </section>
      <p class="workspace-note" id="workspaceNote"></p>
    </section>
  </main>
  <nav class="mobile-app-nav" aria-label="Mobile navigation"><a href="index.html" data-mobile-destination="home">Home</a><a href="index.html#discover" data-mobile-destination="tools">AI Tools</a><a href="account.html?view=chats" data-mobile-destination="history">History</a><a href="account.html?view=projects" data-mobile-destination="projects">Projects</a><a href="account.html?view=account">Account</a></nav>
  <script src="presentation-workflow.js?v=presentation-2"></script>
  <script src="mobile-navigation.js"></script>
</body>
</html>
